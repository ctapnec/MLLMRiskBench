name: offline-core

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package, test and analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,analysis]"
      - name: Lint (ruff, real-error ruleset)
        run: ruff check src/ura experiments tests
      - name: Compile modern package
        run: python -m compileall -q src/ura experiments
      - name: Run offline suite
        run: python -m pytest -q -p no:cacheprovider
